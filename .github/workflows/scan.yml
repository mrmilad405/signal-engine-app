name: Scan and publish live snapshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install real ccxt + engine deps
        run: pip install -r requirements.txt

      - name: Run shipped engine and write docs/data
        run: python scripts/publish_snapshot.py

      - name: Commit refreshed snapshot
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "chore: refresh live snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
